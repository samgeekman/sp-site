<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Space Prospector — Tagline</title>
    <link rel="icon" type="image/png" href="static/fav-icon.png" />
    <style>
      :root {
        --green: #00ff9d;
        --black: #090b0a;
        --mono: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--black);
      }

      #planet-art {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        margin: 0;
        overflow: hidden;
        color: var(--green);
        font: 700 clamp(7px, 1vw, 12px)/1.02 var(--mono);
        font-variant-ligatures: none;
        text-shadow: 0 0 5px var(--green);
        user-select: none;
      }

      .tagline {
        position: fixed;
        top: 50%;
        left: 50%;
        z-index: 1;
        width: fit-content;
        max-width: 94vw;
        padding: 0.2em 0.35em;
        background: var(--black);
        color: var(--green);
        font: 700 clamp(24px, 5vw, 72px)/1.1 var(--mono);
        text-align: center;
        text-shadow: 0 0 12px var(--green);
        transform: translate(-50%, -50%);
      }
    </style>
  </head>
  <body>
    <pre id="planet-art" aria-label="Star field"></pre>
    <div class="tagline">Chart the frontier and sell your discoveries</div>
    <script src="script.js?v=21"></script>
  </body>
</html>
